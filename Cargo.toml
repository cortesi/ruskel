[workspace.package]
version = "0.0.11"
edition = "2024"
authors = ["Aldo Cortesi <aldo@corte.si>"]
description = "Generates skeletonized outlines of Rust crates"
license = "MIT"
repository = "https://github.com/cortesi/ruskel"
readme = "README.md"
keywords = ["docs", "documentation", "outline", "cli"]

[workspace.lints.rust]
missing_docs = "warn"

# Enable briefly, run cargo clippy (without --tests and --examples), fix
# unused deps, then disable it again.
# unused_crate_dependencies = "warn"

[workspace.lints.clippy]
absolute_paths = "warn"
branches_sharing_code = "warn"
ignore_without_reason = "warn"
let_underscore_must_use = "warn"
many_single_char_names = "warn"
missing_docs_in_private_items = "warn"
multiple_inherent_impl = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
self_named_module_files = "warn"
tests_outside_test_module = "warn"
use_self = "warn"
wildcard_dependencies = "warn"
cfg_not_test = "warn"
comparison_chain = "warn"
items_after_statements = "warn"
needless_pass_by_ref_mut = "warn"

# Settings with config values in clippy.toml
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_lines = "warn"

[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.dependencies]
libruskel = { version = "0.0.11", path = "crates/libruskel" }
ruskel-mcp = { version = "0.0.11", path = "crates/mcp" }

anyhow = "1.0.104"
async-trait = "0.1"
bitflags = "2.13.1"
bytesize = "2.7.0"
cargo = "0.99.0"
cargo_toml = "1.0.0"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
fs4 = "1.1.0"
hex = "0.4.3"
once_cell = "1.21"
pretty_assertions = "1.4.1"
regex = "1.13.1"
rust-format = "0.3.4"
rustdoc-types = "0.61.0"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shell-words = "1.1.1"
syn = { version = "2", features = ["full", "parsing"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-onig"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"
timeago = { version = "0.6.1", default-features = false }
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-ident = "1"
which = "8.0"

[workspace.metadata.nanocode]
schema-version = 1
requires-nanocode = ">=0.1, <0.2"
features = "all"
tidy-hooks = [["cargo", "xtask", "gen-std-mapping", "--check"]]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
